<!doctype html>
<html lang="pt-BR" data-layout="{{LAYOUT}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/manual.css">
<script>try{var t=localStorage.getItem("omnidude-manual-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<a class="skip" href="#conteudo">Ir para o conteúdo</a>
<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="Abrir o menu" aria-controls="sidebar" aria-expanded="false">☰</button>
  <a class="brand" href="index.html"><img src="assets/favicon.svg" alt="" width="24" height="24"><span>OmniDude <em>manual</em></span></a>
  <div class="search" role="search">
    <input id="busca" type="search" placeholder="Buscar no manual…  ( / )" autocomplete="off" aria-label="Buscar no manual" aria-controls="resultados">
    <div id="resultados" class="results" hidden></div>
  </div>
  <button class="icon-btn theme-btn" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">◐</button>
</header>
<div class="shell">
  <nav id="sidebar" class="sidebar" aria-label="Capítulos">
{{NAV}}
  </nav>
  <div class="scrim" hidden></div>
  <main id="conteudo" class="content" tabindex="-1">
{{HEAD}}
<article class="prose">
{{BODY}}
</article>
{{PAGER}}
    <footer class="foot">
      <p>OmniDude NMS · versão {{VERSION}} · O manual descreve o que a versão atual faz e, quando algo não foi validado em equipamento real, diz isso.</p>
    </footer>
  </main>
  {{TOC}}
</div>
<div class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Imagem ampliada"><img alt=""><p></p></div>
<script src="assets/search-index.js"></script>
<script src="assets/manual.js"></script>
</body>
</html>
