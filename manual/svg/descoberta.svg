<svg viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-arrow"/></marker></defs>
  <g class="d-t c">
  <rect class="d-box" x="8" y="50" width="120" height="90" rx="10"/><text class="d-t b c" x="68" y="82">1. Faixa</text><text class="d-t s c" x="68" y="102">CIDR + portas</text><text class="d-t s c" x="68" y="118">+ autorização</text>
  <rect class="d-box" x="158" y="50" width="120" height="90" rx="10"/><text class="d-t b c" x="218" y="82">2. Sondagem</text><text class="d-t s c" x="218" y="102">ping e TCP</text><text class="d-t s c" x="218" y="118">em paralelo</text>
  <rect class="d-box" x="308" y="50" width="120" height="90" rx="10"/><text class="d-t b c" x="368" y="82">3. SNMP</text><text class="d-t s c" x="368" y="102">perfis, na</text><text class="d-t s c" x="368" y="118">ordem escolhida</text>
  <rect class="d-box" x="458" y="50" width="120" height="90" rx="10"/><text class="d-t b c" x="518" y="82">4. Passivas</text><text class="d-t s c" x="518" y="102">NetBIOS · SSDP</text><text class="d-t s c" x="518" y="118">mDNS</text>
  <rect class="d-box hl" x="608" y="50" width="120" height="90" rx="10"/><text class="d-t b c" x="668" y="82">5. Identificar</text><text class="d-t s c" x="668" y="102">regras + MAC</text><text class="d-t s c" x="668" y="118">(fabricante)</text>
  <rect class="d-box up" x="758" y="50" width="130" height="90" rx="10"/><text class="d-t b c" x="823" y="82">6. Revisar</text><text class="d-t s c" x="823" y="102">nome e tipo;</text><text class="d-t s c" x="823" y="118">importar</text>
  </g>
  <path class="d-line" d="M128 95H156" marker-end="url(#a3)"/><path class="d-line" d="M278 95H306" marker-end="url(#a3)"/><path class="d-line" d="M428 95H456" marker-end="url(#a3)"/><path class="d-line" d="M578 95H606" marker-end="url(#a3)"/><path class="d-line" d="M728 95H756" marker-end="url(#a3)"/>
  <text class="d-t s c" x="450" y="170">Nada é cadastrado antes da revisão. Hosts já cadastrados não são sondados de novo.</text>
