<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniDude NMS — Entrar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2322c55e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <form id="login" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4" novalidate>
    <div class="flex items-center gap-2">
      <span class="inline-block w-3 h-3 rounded-full bg-up"></span>
      <h1 class="text-xl font-semibold">OmniDude NMS</h1>
    </div>
    <label class="block text-sm">Usuário
      <input name="username" autocomplete="username" required autofocus
             class="mt-1 w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
    </label>
    <label class="block text-sm">Senha
      <input name="password" type="password" autocomplete="current-password" required
             class="mt-1 w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
    </label>
    <p id="error" role="alert" class="text-sm text-red-400 hidden"></p>
    <button class="w-full rounded-md bg-sky-600 hover:bg-sky-500 py-2 font-medium">Entrar</button>
  </form>
  <script src="/js/login.js"></script>
</body>
</html>
